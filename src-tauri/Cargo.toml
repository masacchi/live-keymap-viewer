[package]
name = "live-keymap-viewer"
version = "0.1.1"
description = "Vialキーボードの押しているキーといまのレイヤーをリアルタイムに表示するデスクトップアプリ"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: タスクトレイのアイコン(src/tray.rs)
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# インストーラーと更新(src/updater.rs)。パッケージを作るvpk(.devcontainer/DockerfileのVPK_VERSION)と
# 同じ版に固定する。パッケージの形式と、アプリ側の読み方が食い違わないように
velopack = "=1.2.158"
# Windowsの起動時に自動で起動する(HKCUのRunに登録する)。Rustからだけ使う(画面にはJSのパッケージを入れない)
tauri-plugin-autostart = "2"

# HIDはRustで扱う(docs/ARCHITECTURE.md §2)。Windowsでは、Cのビルドが要らないRustだけの実装を使う。
# Linuxからcargo-xwinでクロスビルドするので、Cのツールチェーンを用意しなくて済む
[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

# Linuxは開発用(コンテナ内のcargo testと、Linux版を動かすとき)。WSLからは実機は見えない
[target.'cfg(not(windows))'.dependencies]
hidapi = { version = "2.6" }

[profile.release]
# 配布サイズを小さくする。Rust側に速さが要る処理は無い(重いのは画面で、それはWebViewの中)
codegen-units = 1
lto = true
opt-level = "s"
strip = true
# panicはunwindのまま(abortにしない)。HIDの読み取りなど裏のスレッドが1つpanicしても、
# アプリごと落とさず、ログに残して画面は動かし続ける(src/logfile.rs)
