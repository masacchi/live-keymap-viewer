[package]
name = "live-keymap-viewer"
version = "0.1.0"
description = "Vial キーボードの押下キーとアクティブレイヤーをリアルタイム表示するデスクトップアプリ"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# インストーラーと更新(src/updater.rs)。包みを作るvpk(.devcontainer/DockerfileのVPK_VERSION)と
# 同じ版に固定する ― 包みの形式と、更新の読み方が食い違わないように
velopack = "=1.2.158"

# HIDはRustで扱う(docs/ARCHITECTURE.md §2)。WindowsはCのビルドが要らない純Rustの実装を使う
# ― Linuxからcargo-xwinでクロスビルドするので、Cのツールチェーンを気にしなくて済む
[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

# Linuxは開発用(コンテナ内のcargo testと、WSLgでLinux版を出すとき)。WSLからは実機は見えない
[target.'cfg(not(windows))'.dependencies]
hidapi = { version = "2.6" }

[profile.release]
# 配布サイズを小さく。速さが要る処理は無い(重いのは画面で、それはWebViewの中)
codegen-units = 1
lto = true
opt-level = "s"
strip = true
# panicはunwindのまま(abortにしない)。HIDの読み取りなど裏のスレッドが1つ転んでも、
# アプリごと落とさず、ログに残して画面は動かし続ける(src/logfile.rs)
