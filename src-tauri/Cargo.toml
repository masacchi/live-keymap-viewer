[package]
name = "live-keymap-viewer"
version = "0.1.0"
description = "Vial キーボードの押下キーとアクティブレイヤーをリアルタイム表示するデスクトップアプリ"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HID は Rust で扱う(docs/ARCHITECTURE.md §2)。Windows は C のビルドが要らない純 Rust の実装を使う
# ― Linux から cargo-xwin でクロスビルドするので、C のツールチェーンを気にしなくて済む
[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

# Linux は開発用(コンテナ内の cargo test と、WSLg で Linux 版を出すとき)。WSL からは実機は見えない
[target.'cfg(not(windows))'.dependencies]
hidapi = { version = "2.6" }

[profile.release]
# 配布サイズを小さく。速さが要る処理は無い(重いのは画面で、それは WebView の中)
codegen-units = 1
lto = true
opt-level = "s"
strip = true
# panic は unwind のまま(abort にしない)。HID の読み取りなど裏のスレッドが 1 つ転んでも、
# アプリごと落とさず、ログに残して画面は動かし続ける(src/logfile.rs)
