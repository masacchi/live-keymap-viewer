# Windows 版をビルドする。
#
#   main に push(マージ)   → ビルドして、この実行の Artifacts に置く
#   v* のタグを push        → ビルドして、GitHub のリリースに載せる。入っているアプリはここから更新する
#   手動(Run workflow)     → 選んだブランチでビルドする。「タグ」を書けば、そのタグでリリースも作る
#                              (タグが無ければ、ビルドした commit に付ける)
#
# 作るもの: インストーラー(Velopack の Setup)と更新の包み、ポータブル版(exe 単体)。
#
# Ubuntu で作る。package-win.mjs(cargo-xwin でクロスビルド)も pack-win.mjs(vpk)も Linux で
# Windows 版を作る作りで(wine も Windows も要らない)、手元のコンテナと同じ手順・同じ結果になるため。
# ツールは .devcontainer/Dockerfile と同じものを直に入れる(CI ではコンテナを通さない ―
# scripts/container.mjs は CI ならそのまま動かす)。
# 詳しくは docs/DEVELOPMENT.md「GitHub Actions でのビルド」。

name: Windows 版のビルド

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'リリースにするタグ(例: v0.2.0)。package.json の版と合わせる。空ならビルドだけ'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    # Rust の初回ビルド(キャッシュが無いとき)に 10 分ほどかかる
    timeout-minutes: 45
    permissions:
      # リリースを作るため(最後の手順だけが使う)
      contents: write
    env:
      # CI ではコミットしないので、husky のフックは入れない
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          # トークンを .git に残さない。npm の install スクリプトなど、後の手順から読めないように
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 版とリリースのタグを決める
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag=${INPUT_TAG:-}
          if [ -z "$tag" ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          fi

          if [ -z "$tag" ]; then
            # リリースしないビルドは、どの commit のものか分かるように名前に入れる
            label="$version-${GITHUB_SHA::7}"
            # 包みの版は SemVer でないといけない。commit が数字だけで 0 から始まると SemVer として
            # 正しくないので、git describe と同じく g を前に付ける
            pack_version="$version-g${GITHUB_SHA::7}"
          else
            # アプリの画面・ログ・「設定 → アプリ」に出る版は package.json から来る。タグと食い違わないように
            if [ "$tag" != "v$version" ]; then
              echo "::error::タグ $tag と package.json の版($version)が合っていません。package.json の版を ${tag#v} にしてからリリースしてください(npm version ${tag#v} で版上げとタグ付けが一度にできます)"
              exit 1
            fi
            # gh release create は既にあるタグをそのまま使う。別の commit のビルドを載せないように止める
            if tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/tags/$tag" --jq .sha 2>/dev/null) &&
              [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::タグ $tag は既に別の commit(${tagged::7})に付いています。Run workflow の「Use workflow from」でそのタグを選んで実行してください"
              exit 1
            fi
            label=$version
            pack_version=$version
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "pack_version=$pack_version" >> "$GITHUB_OUTPUT"
          echo "版: $label / リリース: ${tag:-しない}"

      - name: ビルドの道具を入れる(.devcontainer/Dockerfile と同じもの)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev libudev-dev clang lld llvm
          rustup toolchain install stable --profile minimal \
            --component clippy,rustfmt --target x86_64-pc-windows-msvc
          rustup default stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: vpk(Velopack の CLI)を入れる
        run: |
          # 版は .devcontainer/Dockerfile の VPK_VERSION に合わせる(Cargo.toml の velopack とも同じ)
          version=$(sed -n 's/^ARG VPK_VERSION=//p' .devcontainer/Dockerfile)
          dotnet tool install --global vpk --version "$version"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # crate のビルド結果と、cargo-xwin が落としてくる MSVC の CRT / Windows SDK を残す
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-directories: ~/.cache/cargo-xwin

      - run: npm ci

      - name: 検査(型チェック・lint・テスト)
        run: npm run check

      - name: 検査(Rust の整形・clippy・テスト)
        run: npm run check:rust

      - name: Windows 版を作る(dist/win32-x64/LiveKeymapViewer.exe)
        run: npm run package:win

      - name: インストーラーと更新の包み、ポータブル版を作る
        env:
          LABEL: ${{ steps.meta.outputs.label }}
          PACK_VERSION: ${{ steps.meta.outputs.pack_version }}
        run: |
          node scripts/pack-win.mjs --version "$PACK_VERSION"
          # Actions の Artifacts には、どのビルドか分かる名前で置く
          mkdir -p dist/artifacts
          cp dist/releases/live-keymap-viewer-win-Setup.exe \
            "dist/artifacts/LiveKeymapViewer-$LABEL-win-x64-setup.exe"
          # ポータブル版は exe をそのまま置く(Tauri の exe は 1 つで完結する。自分では更新しない)
          cp dist/win32-x64/LiveKeymapViewer.exe \
            "dist/artifacts/LiveKeymapViewer-$LABEL-win-x64-portable.exe"
          ls -l dist/releases dist/artifacts

      # どちらも圧縮済みなので、zip に包まずそのまま置く(ダウンロードしたものがそのまま使える)
      - name: Artifacts に置く(インストーラー)
        uses: actions/upload-artifact@v7
        with:
          path: dist/artifacts/LiveKeymapViewer-${{ steps.meta.outputs.label }}-win-x64-setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Artifacts に置く(ポータブル版)
        uses: actions/upload-artifact@v7
        with:
          path: dist/artifacts/LiveKeymapViewer-${{ steps.meta.outputs.label }}-win-x64-portable.exe
          archive: false
          if-no-files-found: error
          retention-days: 14

      # 入っているアプリは、最新の正式リリースの releases.win.json を見て更新する
      # (src-tauri/src/updater.rs)。載せるのは vpk upload github ― 目録と包みを、
      # アプリが読む名前のまま載せる
      - name: リリースに載せる
        if: steps.meta.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          LABEL: ${{ steps.meta.outputs.label }}
        run: |
          flags=()
          # v0.2.0-beta.1 のように - の付くものはプレリリースにする(アプリの更新の対象にならない)
          if [[ "$TAG" == *-* ]]; then
            flags+=(--pre)
          fi
          # --channel は必ず付ける(付けないと、動いている OS から linux になる)。
          # --merge で、同じタグで流し直したときは添付を差し替える
          vpk upload github --outputDir dist/releases --channel win \
            --repoUrl "https://github.com/$GITHUB_REPOSITORY" --token "$GH_TOKEN" \
            --publish --merge --releaseName "$TAG" --tag "$TAG" --targetCommitish "$GITHUB_SHA" \
            "${flags[@]}"
          gh release upload "$TAG" "dist/artifacts/LiveKeymapViewer-$LABEL-win-x64-portable.exe" \
            --repo "$GITHUB_REPOSITORY" --clobber
