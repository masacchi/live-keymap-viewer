# Windows版をビルドする。
#
#   mainにpush(マージ)   → ビルドして、GitHubのリリース(dev-build。プレリリース)に置く
#   v*のタグをpush        → ビルドして、GitHubの正式リリースに載せる。入っているアプリはここから更新する
#   手動(Run workflow)     → 選んだブランチでビルドする。「タグ」を書けば、そのタグでリリースも作る
#                              (タグが無ければ、dev-buildリリースを更新)
#
# 作るもの: インストーラー(VelopackのSetup)と更新の包み、ポータブル版(exe単体)。
#
# Ubuntuで作る。package-win.mjs(cargo-xwinでクロスビルド)もpack-win.mjs(vpk)もLinuxで
# Windows版を作る作りで(wineもWindowsも要らない)、手元のコンテナと同じ手順・同じ結果になるため。
# ツールは.devcontainer/Dockerfileと同じものを直に入れる(CIではコンテナを通さない ―
# scripts/container.mjsはCIならそのまま動かす)。
# 詳しくはdocs/DEVELOPMENT.md「GitHub Actionsでのビルド」。

name: Windows 版のビルド

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'リリースにするタグ(例: v0.2.0)。package.json の版と合わせる。空ならビルドだけ'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    # Rustの初回ビルド(キャッシュが無いとき)に10分ほどかかる
    timeout-minutes: 45
    permissions:
      # リリースを作るため
      contents: write
    env:
      # CIではコミットしないので、huskyのフックは入れない
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          # トークンを.gitに残さない。npmのinstallスクリプトなど、後の手順から読めないように
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 版とリリースのタグを決める
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag=${INPUT_TAG:-}
          if [ -z "$tag" ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          fi

          if [ -z "$tag" ]; then
            # リリースしないビルドは、どのcommitのものか分かるように名前に入れる
            label="$version-${GITHUB_SHA::7}"
            # 包みの版はSemVerでないといけない。commitが数字だけで0から始まるとSemVerとして
            # 正しくないので、git describeと同じくgを前に付ける
            pack_version="$version-g${GITHUB_SHA::7}"
          else
            # アプリの画面・ログ・「設定 → アプリ」に出る版はpackage.jsonから来る。タグと食い違わないように
            if [ "$tag" != "v$version" ]; then
              echo "::error::タグ $tag と package.json の版($version)が合っていません。package.json の版を ${tag#v} にしてからリリースしてください(npm version ${tag#v} で版上げとタグ付けが一度にできます)"
              exit 1
            fi
            # gh release createは既にあるタグをそのまま使う。別のcommitのビルドを載せないように止める
            if tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/tags/$tag" --jq .sha 2>/dev/null) &&
              [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::タグ $tag は既に別の commit(${tagged::7})に付いています。Run workflow の「Use workflow from」でそのタグを選んで実行してください"
              exit 1
            fi
            label=$version
            pack_version=$version
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "pack_version=$pack_version" >> "$GITHUB_OUTPUT"
          echo "版: $label / リリース: ${tag:-しない(dev-buildを更新)}"

      - name: ビルドの道具を入れる(.devcontainer/Dockerfile と同じもの)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev libudev-dev clang lld llvm
          rustup toolchain install stable --profile minimal \
            --component clippy,rustfmt --target x86_64-pc-windows-msvc
          rustup default stable

      # crateのビルド結果と、cargo-xwinが落としてくるMSVCのCRT / Windows SDKを残す。
      # 下でcargo installするcargo-xwin(~/.cargo/bin)も残るので、2回目からはビルドし直さない
      # (rustcの版がキャッシュの鍵に入るので、Rustを入れた後に置く)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-directories: ~/.cache/cargo-xwin

      - name: cargo-xwin を入れる
        run: |
          # 配布されているバイナリ(install-actionなどが入れるmusl版)は使わない。メモリの取り回しが遅く、
          # MSVCのCRTの初回ダウンロードが10分以上かかる。crates.ioからビルドしたglibc版なら十数秒。
          # 版は.devcontainer/DockerfileのCARGO_XWIN_VERSIONに合わせる(同じ版ならビルドを飛ばす)
          version=$(sed -n 's/^ARG CARGO_XWIN_VERSION=//p' .devcontainer/Dockerfile)
          cargo install --locked cargo-xwin --version "$version"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: vpk(Velopack の CLI)を入れる
        run: |
          # 版は.devcontainer/DockerfileのVPK_VERSIONに合わせる(Cargo.tomlのvelopackとも同じ)
          version=$(sed -n 's/^ARG VPK_VERSION=//p' .devcontainer/Dockerfile)
          dotnet tool install --global vpk --version "$version"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - run: npm ci

      - name: 検査(型チェック・lint・テスト)
        run: npm run check

      - name: 検査(Rust の整形・clippy・テスト)
        run: npm run check:rust

      - name: Windows 版を作る(dist/win32-x64/LiveKeymapViewer.exe)
        run: npm run package:win

      - name: インストーラーと更新の包み、ポータブル版を作る
        env:
          LABEL: ${{ steps.meta.outputs.label }}
          PACK_VERSION: ${{ steps.meta.outputs.pack_version }}
        run: |
          node scripts/pack-win.mjs --version "$PACK_VERSION"
          # dev-buildや正式リリースの添付には、どのビルドか分かる名前で置く
          mkdir -p dist/artifacts
          cp dist/releases/live-keymap-viewer-win-Setup.exe \
            "dist/artifacts/LiveKeymapViewer-$LABEL-win-x64-setup.exe"
          # ポータブル版はexeをそのまま置く(Tauriのexeは1つで完結する。自分では更新しない)
          cp dist/win32-x64/LiveKeymapViewer.exe \
            "dist/artifacts/LiveKeymapViewer-$LABEL-win-x64-portable.exe"
          ls -l dist/releases dist/artifacts

      # 入っているアプリは、最新の正式リリースのreleases.win.jsonを見て更新する
      # (src-tauri/src/updater.rs)。正式リリースに載せるのはvpk upload github ― 目録と包みを、
      # アプリが読む名前のまま載せる。dev-buildはプレリリースなので、更新の対象にならない
      - name: リリース・成果物に載せる
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          LABEL: ${{ steps.meta.outputs.label }}
        run: |
          if [ -n "$TAG" ]; then
            flags=()
            # v0.2.0-beta.1のように - の付くものはプレリリースにする(アプリの更新の対象にならない)
            if [[ "$TAG" == *-* ]]; then
              flags+=(--pre)
            fi
            # --channelは必ず付ける(付けないと、動いているOSからlinuxになる)。
            # --mergeで、同じタグで流し直したときは添付を差し替える
            vpk upload github --outputDir dist/releases --channel win \
              --repoUrl "https://github.com/$GITHUB_REPOSITORY" --token "$GH_TOKEN" \
              --publish --merge --releaseName "$TAG" --tag "$TAG" --targetCommitish "$GITHUB_SHA" \
              "${flags[@]}"
            gh release upload "$TAG" "dist/artifacts/LiveKeymapViewer-$LABEL-win-x64-portable.exe" \
              --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi

          # 正式なタグがない場合(mainへのpushや手動実行)は、固定の「dev-build」に置く
          RELEASE_TAG=dev-build
          FILES=(dist/artifacts/*)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "既存のリリース($RELEASE_TAG)が見つかりました。ファイルを最新版に差し替えます。"
            # --clobberで同名ファイルがあっても上書き
            gh release upload "$RELEASE_TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "新しいリリース($RELEASE_TAG)を作成します。"
            gh release create "$RELEASE_TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Development Build ($LABEL)" --generate-notes --prerelease
          fi
