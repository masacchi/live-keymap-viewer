# Windows版をビルドする。
#
#   - mainへのpush(マージを含む):
#       - package.jsonの版のタグ(v0.1.1など)がまだ無ければ、リリースする。タグもここで付ける
#         (版を上げてpushするだけでリリースになる。タグを別にpushしてもう一度ビルドしなくて済む)
#       - あれば開発版をビルドして、GitHubのリリース「dev-build」(プレリリース)に置く。
#         開発版は別のアプリ(Live Keymap Viewer Dev)として入り、dev-buildから更新する
#   - v*のタグのpush: ビルドして正式リリースに載せる。インストール済みのアプリはここから更新する
#   - 手動(Run workflow): 選んだブランチでビルドする。「タグ」を書けば、そのタグでリリースも作る
#     (書かなければdev-buildを更新する)
#
# 作るもの: インストーラー(VelopackのSetup)と更新用のパッケージ、ポータブル版(exe単体)。
#
# Ubuntuで作る。package-win.mjs(cargo-xwinでクロスビルド)もpack-win.mjs(vpk)もLinuxで
# Windows版を作れるので(wineもWindowsも要らない)、手元のコンテナと同じ手順・同じ結果になる。
# ツールは.devcontainer/Dockerfileと同じものを直に入れる(CIではコンテナを通さない。
# scripts/container.mjsはCIならそのまま動かす)。
# 詳しくはdocs/DEVELOPMENT.md「GitHub Actionsでのビルド」。

name: Windows版のビルド

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'リリースにするタグ(例: v0.2.0)。package.json の版と合わせる。空ならビルドだけ'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    # Rustの初回ビルド(キャッシュが無いとき)に10分ほどかかる
    timeout-minutes: 45
    permissions:
      # リリースを作るため
      contents: write
    env:
      # CIではコミットしないので、huskyのフックは入れない
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          # トークンを.gitに残さない。npmのinstallスクリプトなど、後の手順から読めないように
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 版とリリースのタグを決める
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag=${INPUT_TAG:-}
          # 手で書くタグは「0.1.0」とvを付け忘れやすい。数字で始まっていればvを補う
          if [[ "$tag" =~ ^[0-9] ]]; then
            tag="v$tag"
          fi
          if [ -z "$tag" ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          fi
          # mainへのpushで、版のタグがまだ無ければ(版を上げたpush)リリースにする。
          # 問い合わせの失敗を「タグが無い」と取り違えると、既にある版を作り直してしまうので、
          # 失敗したら止める(ls-remoteは、無ければ何も出さずに成功する)
          if [ -z "$tag" ] && [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            if ! remote_tag=$(git ls-remote --tags origin "refs/tags/v$version"); then
              echo "::error::タグ v$version があるか確かめられませんでした。もう一度実行してください"
              exit 1
            fi
            if [ -z "$remote_tag" ]; then
              echo "タグ v$version がまだ無いので、リリースします"
              tag=v$version
            fi
          fi

          if [ -z "$tag" ]; then
            # 開発版。入っている開発版はdev-buildの版と比べて更新するので、ビルドのたびに版が増えるよう
            # 実行番号を入れる(commitのハッシュでは新しい順に並ばない)。元にするのは次のパッチ版。
            # 0.1.0-dev.Nは、出したばかりの0.1.0より古いものとして扱われるため
            IFS=. read -r major minor patch <<< "${version%%-*}"
            pack_version="$major.$minor.$((patch + 1))-dev.$GITHUB_RUN_NUMBER"
            label=$pack_version
            dev=true
          else
            # アプリの画面・ログ・「設定 → アプリ」に出る版はpackage.jsonから来る。タグと食い違わないように
            if [ "$tag" != "v$version" ]; then
              echo "::error::タグ $tag が package.json の版($version)と合っていません。タグは v$version にしてください。別の版を出すなら、先に package.json の版を上げてください(npm version ${tag#v} で版を上げて main に push すれば、そのままリリースになります)"
              exit 1
            fi
            # gh release createは既にあるタグをそのまま使う。別のcommitのビルドを載せないように止める
            if tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/tags/$tag" --jq .sha 2>/dev/null) &&
              [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::タグ $tag は既に別の commit(${tagged::7})に付いています。Run workflow の「Use workflow from」でそのタグを選んで実行してください"
              exit 1
            fi
            label=$version
            pack_version=$version
            dev=false
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "pack_version=$pack_version" >> "$GITHUB_OUTPUT"
          # 開発版はpackage-win.mjs / pack-win.mjsに--devを渡す
          echo "dev_args=$([ "$dev" = true ] && echo --dev)" >> "$GITHUB_OUTPUT"
          echo "版: $label / リリース: ${tag:-しない(開発版としてdev-buildを更新)}"

      - name: ビルドの道具を入れる(.devcontainer/Dockerfileと同じもの)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev libudev-dev clang lld llvm
          rustup toolchain install stable --profile minimal \
            --component clippy,rustfmt --target x86_64-pc-windows-msvc
          rustup default stable

      # crateのビルド結果と、cargo-xwinがダウンロードするMSVCのCRT / Windows SDKを残す。
      # 下でcargo installするcargo-xwin(~/.cargo/bin)も残るので、2回目からはビルドし直さない
      # (rustcの版がキャッシュの鍵に入るので、Rustを入れた後に置く)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-directories: ~/.cache/cargo-xwin

      - name: cargo-xwinを入れる
        run: |
          # 配布されているバイナリ(install-actionなどが入れるmusl版)は使わない。メモリの取り回しが遅く、
          # MSVCのCRTの初回ダウンロードが10分以上かかる。crates.ioからビルドしたglibc版なら十数秒。
          # 版は.devcontainer/DockerfileのCARGO_XWIN_VERSIONに合わせる(同じ版ならビルドを飛ばす)
          version=$(sed -n 's/^ARG CARGO_XWIN_VERSION=//p' .devcontainer/Dockerfile)
          cargo install --locked cargo-xwin --version "$version"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: vpk(VelopackのCLI)を入れる
        run: |
          # 版は.devcontainer/DockerfileのVPK_VERSIONに合わせる(Cargo.tomlのvelopackとも同じ)
          version=$(sed -n 's/^ARG VPK_VERSION=//p' .devcontainer/Dockerfile)
          dotnet tool install --global vpk --version "$version"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - run: npm ci

      - name: 検査(型チェック・lint・テスト)
        run: npm run check

      - name: 検査(Rustの整形・clippy・テスト)
        run: npm run check:rust

      - name: Windows版を作る(dist/win32-x64/LiveKeymapViewer.exe)
        env:
          PACK_VERSION: ${{ steps.meta.outputs.pack_version }}
          DEV_ARGS: ${{ steps.meta.outputs.dev_args }}
        # DEV_ARGSは空か--dev。空のときに空の引数を渡さないよう、引用符で囲まない
        run: npm run package:win -- --version "$PACK_VERSION" $DEV_ARGS

      - name: インストーラーと更新用のパッケージ、ポータブル版を作る
        env:
          LABEL: ${{ steps.meta.outputs.label }}
          PACK_VERSION: ${{ steps.meta.outputs.pack_version }}
          DEV_ARGS: ${{ steps.meta.outputs.dev_args }}
        run: |
          node scripts/pack-win.mjs --version "$PACK_VERSION" $DEV_ARGS
          # dev-buildや正式リリースの添付には、どのビルドか分かる名前で置く
          mkdir -p dist/artifacts
          name=LiveKeymapViewer
          if [ -n "$DEV_ARGS" ]; then
            name=LiveKeymapViewer-Dev
            # 開発版はvpk upload githubを使わずにdev-buildへ載せる(下)ので、アプリが更新に読む
            # リリースの一覧とパッケージも、ここで添付に加えておく
            cp dist/releases/releases.win.json dist/releases/*-full.nupkg dist/artifacts/
          fi
          # Setupの名前はパッケージIDから決まる(開発版はlive-keymap-viewer-dev-win-Setup.exe)
          cp dist/releases/*-win-Setup.exe "dist/artifacts/$name-$LABEL-win-x64-setup.exe"
          # ポータブル版はexeをそのまま置く(Tauriのexeは1つで完結する。自分では更新しない)
          cp dist/win32-x64/LiveKeymapViewer.exe "dist/artifacts/$name-$LABEL-win-x64-portable.exe"
          ls -l dist/releases dist/artifacts

      # 入っているアプリは、最新の正式リリースのreleases.win.jsonを見て更新する
      # (src-tauri/src/updater.rs)。正式リリースに載せるのはvpk upload github。リリースの一覧と
      # パッケージを、アプリが読む名前のまま載せる。dev-buildはプレリリースなので、リリース版の
      # 更新の対象にならない(開発版はdev-buildのreleases.win.jsonを直に読む)
      - name: リリース・成果物に載せる
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          LABEL: ${{ steps.meta.outputs.label }}
        run: |
          if [ -n "$TAG" ]; then
            # リリースの本文に、前の正式リリースからのcommitの一覧を載せる(vpkが作るリリースは本文が
            # ほぼ空で、何が変わったか分からない)。前のリリースは、載せる前の「最新」で決める。
            # 同じタグで流し直したときは「最新」が自分なので、本文はそのままにする
            prev=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
            notes=
            if [ -z "$prev" ]; then
              notes=dist/notes.md
              printf '最初のリリースです。\n' > "$notes"
            elif [ "$prev" != "$TAG" ]; then
              notes=dist/notes.md
              {
                printf '## %sからの変更\n\n' "$prev"
                gh api "repos/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_SHA" \
                  --jq '.commits[].commit.message | split("\n")[0] | "- " + .'
              } > "$notes"
            fi

            flags=()
            # v0.2.0-beta.1のように「-」の付くものはプレリリースにする(アプリの更新の対象にならない)
            if [[ "$TAG" == *-* ]]; then
              flags+=(--pre)
            fi
            # --channelは必ず付ける(付けないと、動いているOSからlinuxになる)。
            # --mergeで、同じタグで流し直したときは添付を差し替える
            vpk upload github --outputDir dist/releases --channel win \
              --repoUrl "https://github.com/$GITHUB_REPOSITORY" --token "$GH_TOKEN" \
              --publish --merge --releaseName "$TAG" --tag "$TAG" --targetCommitish "$GITHUB_SHA" \
              "${flags[@]}"
            gh release upload "$TAG" "dist/artifacts/LiveKeymapViewer-$LABEL-win-x64-portable.exe" \
              --repo "$GITHUB_REPOSITORY" --clobber
            if [ -n "$notes" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
            fi
            exit 0
          fi

          # 正式なタグがない場合(mainへのpushや手動実行)は、固定の「dev-build」に置く。
          # vpk upload githubを使わないのは、前の版のパッケージが一覧(releases.win.json)ごと
          # 積み重なっていくため。開発版の更新に要るのは最新のパッケージと一覧だけなので、
          # 載せ替えて前のものを消す
          RELEASE_TAG=dev-build
          FILES=(dist/artifacts/*)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "既存のリリース($RELEASE_TAG)が見つかりました。ファイルを最新版に差し替えます。"
            # --clobberで同名ファイルがあっても上書き
            gh release upload "$RELEASE_TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            # 前のビルドの添付を消す。ファイル名にcommitが入るので、上書きされずにたまっていくため
            # (新しいものを載せてから消すので、添付が空になる時間は無い)
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
              while read -r name; do
                if [ ! -e "dist/artifacts/$name" ]; then
                  gh release delete-asset "$RELEASE_TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes
                fi
              done
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Development Build ($LABEL, ${GITHUB_SHA::7})"
          else
            echo "新しいリリース($RELEASE_TAG)を作成します。"
            gh release create "$RELEASE_TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Development Build ($LABEL, ${GITHUB_SHA::7})" --generate-notes --prerelease
          fi
